<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VOODOO SYSTEM :: PATCH GENERATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;background:#000;color:#00d4ff;padding:20px;min-height:100vh}
.container{max-width:1200px;margin:0 auto}
.logo-container{text-align:center;margin-bottom:20px}
.logo{max-width:600px;width:100%;height:auto;transition:all 0.3s}
.logo:hover{animation:glitch 0.3s infinite;filter:drop-shadow(0 0 25px #00d4ff) drop-shadow(0 0 40px #7b2ff7) drop-shadow(0 0 60px #a0c4ff) drop-shadow(0 0 80px #b794f6)}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-3px,3px);filter:drop-shadow(0 0 30px #00d4ff) drop-shadow(0 0 50px #7b2ff7)}40%{transform:translate(-3px,-3px);filter:drop-shadow(0 0 35px #a0c4ff) drop-shadow(0 0 55px #b794f6)}60%{transform:translate(3px,3px);filter:drop-shadow(0 0 40px #00d4ff) drop-shadow(0 0 60px #7b2ff7)}80%{transform:translate(3px,-3px);filter:drop-shadow(0 0 45px #a0c4ff) drop-shadow(0 0 65px #b794f6)}100%{transform:translate(0)}}
.subtitle{text-align:center;color:#7b2ff7;font-size:0.9em;margin-bottom:30px;font-style:italic;opacity:0.8}
.section-tabs{display:flex;gap:10px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
.tab-button{background:#1a1f3a;color:#00d4ff;border:2px solid #00d4ff;padding:15px 30px;font-size:16px;font-family:'Courier New',monospace;cursor:pointer;transition:all 0.3s}
.tab-button.active{background:linear-gradient(135deg,#7b2ff7 0%,#00d4ff 100%);color:#000;box-shadow:0 0 30px rgba(123,47,247,0.8);border-color:#7b2ff7}
.tab-button:hover{box-shadow:0 0 20px rgba(0,212,255,0.5);transform:translateY(-2px)}
.tab-content{display:none}
.tab-content.active{display:block}
.quick-buttons{display:flex;gap:10px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
.advanced-section{background:rgba(26,31,58,0.3);border:2px solid #00d4ff;padding:20px;margin-bottom:30px;box-shadow:0 0 40px rgba(0,212,255,0.3)}
.advanced-title{text-align:center;font-size:1.3em;margin-bottom:20px;color:#7b2ff7;text-shadow:0 0 15px #7b2ff7}
.controls-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:20px}
.control-group{background:rgba(15,8,32,0.5);padding:15px;border-left:3px solid #7b2ff7}
.control-label{color:#00d4ff;font-size:0.9em;margin-bottom:10px;display:block;text-transform:uppercase}
.stack-control{display:flex;align-items:center;gap:10px;margin-top:10px}
.stack-label{color:#a0c4ff;font-size:0.8em;min-width:80px}
.stack-slider{flex:1;height:6px;background:#1a1f3a;border:1px solid #00d4ff;outline:none}
.stack-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:linear-gradient(135deg,#7b2ff7 0%,#00d4ff 100%);cursor:pointer;border-radius:50%}
.stack-slider::-moz-range-thumb{width:20px;height:20px;background:linear-gradient(135deg,#7b2ff7 0%,#00d4ff 100%);cursor:pointer;border-radius:50%;border:none}
.stack-value{color:#7b2ff7;font-weight:bold;min-width:30px;text-align:center}
select{width:100%;background:#000;color:#00d4ff;border:1px solid #00d4ff;padding:10px;font-family:'Courier New',monospace;font-size:14px;cursor:pointer}
select:hover{background:#0a0a0a;box-shadow:0 0 15px rgba(0,212,255,0.4)}
button{background:#1a1f3a;color:#00d4ff;border:2px solid #00d4ff;padding:15px 30px;font-size:16px;font-family:'Courier New',monospace;cursor:pointer;transition:all 0.3s}
button:hover{box-shadow:0 0 25px rgba(0,212,255,0.6);transform:translateY(-2px)}
.generate-custom{display:block;margin:20px auto 0;font-size:18px;padding:20px 40px;background:linear-gradient(135deg,#7b2ff7 0%,#00d4ff 100%);color:#000;font-weight:bold;border-color:#7b2ff7}
.results{background:rgba(26,31,58,0.3);border:2px solid #7b2ff7;padding:30px;box-shadow:0 0 50px rgba(123,47,247,0.4)}
.patch-card{margin-bottom:25px;padding:20px;background:rgba(15,8,32,0.5);border-left:4px solid #00d4ff;position:relative}
.patch-category{font-size:0.8em;color:#7b2ff7;margin-bottom:10px;text-transform:uppercase;letter-spacing:2px}
.stack-layer{padding:15px 0;border-bottom:1px solid rgba(0,212,255,0.2);position:relative}
.stack-layer:last-child{border-bottom:none;padding-bottom:0}
.layer-controls{position:absolute;top:15px;right:0;display:flex;gap:5px}
.edit-btn,.delete-btn{padding:5px 10px;font-size:12px;background:rgba(26,31,58,0.8);border:1px solid #00d4ff}
.delete-btn{background:rgba(139,0,0,0.3);border-color:#ff4444;color:#ff4444}
.patch-synth{color:#00d4ff;font-size:0.9em;margin-bottom:5px;padding-right:120px}
.patch-name{font-size:1.3em;font-weight:bold;margin-bottom:10px;color:#fff;text-shadow:0 0 15px rgba(0,212,255,0.6);padding-right:120px}
.patch-description{color:#a0c4ff;font-size:0.95em;line-height:1.5;padding-right:120px}
.add-stack-btn{margin-top:10px;padding:8px 15px;font-size:13px;background:linear-gradient(135deg,#7b2ff7 0%,#00d4ff 100%);color:#000;border-color:#7b2ff7}
.combo-title{text-align:center;margin-bottom:20px;font-size:1.8em;background:linear-gradient(135deg,#00d4ff 0%,#7b2ff7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold}
.export-container{text-align:center;margin-bottom:20px}
.export-btn{padding:10px 20px;font-size:14px;background:linear-gradient(135deg,#00d4ff 0%,#7b2ff7 100%);color:#000;border-color:#00d4ff;font-weight:bold}
.loading{text-align:center;padding:40px;font-size:1.2em;color:#7b2ff7}
.regenerate-btn{position:absolute;top:15px;right:15px;padding:8px 15px;font-size:12px;background:linear-gradient(135deg,#7b2ff7 0%,#00d4ff 100%);color:#000;border-color:#7b2ff7}
.patch-dropdown{width:100%;max-width:400px;margin-top:10px;padding:8px;background:#000;color:#00d4ff;border:1px solid #7b2ff7;font-family:'Courier New',monospace;font-size:12px}
</style>
</head>

function updateStackValue(el,c){document.getElementById(c+'-stack-value').textContent=el.value+'x'}
function switchTab(t){document.querySelectorAll('.tab-button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));event.target.classList.add('active');document.getElementById('tab-'+t).classList.add('active')}
function canStack(s,u){return MULTI.includes(s)||!u.some(l=>l.synth===s)}
function getStacked(cat,syn,num){let all=PATCHES[cat]||[];if(syn!=='random')all=all.filter(p=>p.synth===syn);if(!all.length)all=PATCHES[cat]||[];let layers=[],used=new Set();for(let i=0;i<num;i++){let avail=all.filter(p=>!used.has(p.name)&&canStack(p.synth,layers));if(!avail.length)avail=all.filter(p=>!used.has(p.name));if(!avail.length)break;const p=avail[Math.floor(Math.random()*avail.length)];layers.push(p);used.add(p.name)}return layers}

function regen(i){const cat=currentCombo[i];cat.layers=getStacked(cat.category,'random',cat.layers.length);display()}
function addLayer(i){const cat=currentCombo[i];const n=getStacked(cat.category,'random',1);if(n.length>0&&canStack(n[0].synth,cat.layers)&&!cat.layers.some(l=>l.name===n[0].name)){cat.layers.push(n[0]);display()}else alert('Cannot stack!')}
function delLayer(i,j){if(currentCombo[i].layers.length>1){currentCombo[i].layers.splice(j,1);display()}else alert('Cannot delete last layer!')}

function exportReaper(){
  if(!currentCombo||currentCombo.length===0){alert('Generate combo first!');return}
  let rpp=atob(TMPL);
  const synthPatches={};
  currentCombo.forEach(item=>{
    if(!item.layers)return;
    item.layers.forEach(p=>{
      if(!synthPatches[p.synth])synthPatches[p.synth]=[];
      synthPatches[p.synth].push(item.category.toUpperCase()+': '+p.name);
    });
  });
  Object.entries(synthPatches).forEach(([synth,patches])=>{
    const track=SYNTH_TRACK[synth];
    if(!track)return;
    const newName=track+' :: '+patches.join(' | ');
    rpp=rpp.split('NAME "'+track+'"').join('NAME "'+newName+'"');
  });
  const b=new Blob([rpp],{type:'text/plain'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;
  a.download='voodoo_combo_'+Date.now()+'.RPP';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(u);
  alert('Reaper template exported with your MIDI config!');
}
function display(){const r=document.getElementById('results');if(!currentCombo||currentCombo.length===0){r.innerHTML='<div class="loading">:: NO DATA ::</div>';return}let h='<div class="combo-title">⚡ VOODOO PATCH COMBO ⚡</div><div class="export-container"><button class="export-btn" onclick="exportReaper()">💾 EXPORT TO REAPER</button></div>';currentCombo.forEach((item,ci)=>{if(!item.layers||item.layers.length===0)return;h+='<div class="patch-card"><button class="regenerate-btn" onclick="regen('+ci+')">🔄 REGENERATE</button><div class="patch-category">'+item.category.toUpperCase()+'</div>';item.layers.forEach((p,li)=>{h+='<div class="stack-layer">';if(item.layers.length>1)h+='<div class="layer-controls"><button class="edit-btn" onclick="editLayer('+ci+','+li+')">✏️ EDIT</button><button class="delete-btn" onclick="delLayer('+ci+','+li+')">🗑️ DELETE</button></div>';h+='<div class="patch-synth">'+p.synth+'</div><div class="patch-name">'+p.name+'</div><div class="patch-description">'+p.description+'</div></div>'});h+='<button class="add-stack-btn" onclick="addLayer('+ci+')">+ STACK LAYER</button></div>'});r.innerHTML=h}
</script>
